<div class="patient-container">
  <button
    class="mobile-menu-btn"
    type="button"
    (click)="toggleSidebar()"
    aria-label="Открыть меню"
  >
    <lucide-angular [img]="Menu" [size]="22"></lucide-angular>
  </button>

  <div
    class="sidebar-backdrop"
    [class.visible]="isSidebarOpen()"
    (click)="toggleSidebar()"
    aria-hidden="true"
  ></div>

  <aside class="sidebar" [class.collapsed]="!isSidebarOpen()">
    <div class="sidebar-header">
      <div>
        <h2>Личный кабинет</h2>
        <p>Портал пациента</p>
      </div>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <lucide-angular [img]="Menu" [size]="25"></lucide-angular>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/patient/appointments" routerLinkActive="active" class="nav-item">
        <lucide-angular [img]="Calendar" [size]="20"></lucide-angular>
        @if (isSidebarOpen()) {
          <span>Мои записи</span>
        }
      </a>
      <a routerLink="/patient/documents" routerLinkActive="active" class="nav-item">
        <lucide-angular [img]="FileText" [size]="20"></lucide-angular>
        @if (isSidebarOpen()) {
          <span>Документы</span>
        }
      </a>
      <a routerLink="/patient/profile" routerLinkActive="active" class="nav-item">
        <lucide-angular [img]="User" [size]="20"></lucide-angular>
        @if (isSidebarOpen()) {
          <span>Профиль</span>
        }
      </a>
    </nav>

    <div class="sidebar-footer">
      @if (isSidebarOpen()) {
        <div class="user-info">
          <div class="user-avatar">
            {{ patientName.charAt(0) }}
          </div>
          <div class="user-details">
            <p class="user-name">{{ patientName }}</p>
          </div>
        </div>
      }
      <button class="logout-btn" (click)="logout()" [title]="'Выйти'">
        <lucide-angular [img]="LogOut" [size]="20"></lucide-angular>
        @if (isSidebarOpen()) {
          <span>Выйти</span>
        }
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
